<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Lil' Cocolates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ══ LOGIN SCREEN ══ -->
<div class="admin-login-wrap" id="adminLoginWrap">
  <form class="admin-login-box" id="adminLoginForm">
    <div class="admin-login-logo">LC</div>
    <h1 class="admin-login-title">Lil' Cocolates</h1>
    <p class="admin-login-sub">Admin Dashboard</p>

    <label class="admin-field">
      <span>Email</span>
      <input type="email" id="adminEmail" required autocomplete="username">
    </label>

    <label class="admin-field">
      <span>Password</span>
      <input type="password" id="adminPassword" required autocomplete="current-password">
    </label>

    <p class="admin-login-error" id="adminLoginError"></p>

    <button type="submit" class="admin-login-btn" id="adminLoginBtn">Login</button>
  </form>
</div>

<!-- ══ DASHBOARD ══ -->
<div class="admin-dashboard" id="adminDashboard" style="display:none;">

  <header class="admin-header">
    <div class="admin-header-left">
      <div class="admin-logo-badge">LC</div>
      <div>
        <h1>Hii!! <span>Lavanya...</span></h1>
      </div>
    </div>
    <button class="admin-logout-btn" id="adminLogoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</button>
  </header>

  <!-- Stats -->
  <div class="admin-stats-row" id="adminStatsRow">
    <div class="admin-stat-card">
      <div class="admin-stat-icon"><i class="bi bi-receipt"></i></div>
      <div>
        <div class="admin-stat-value" id="statTotal">0</div>
        <div class="admin-stat-label">Total orders</div>
      </div>
    </div>
    <div class="admin-stat-card stat-pending">
      <div class="admin-stat-icon"><i class="bi bi-hourglass-split"></i></div>
      <div>
        <div class="admin-stat-value" id="statPending">0</div>
        <div class="admin-stat-label">Pending review</div>
      </div>
    </div>
    <div class="admin-stat-card stat-today">
      <div class="admin-stat-icon"><i class="bi bi-calendar-check"></i></div>
      <div>
        <div class="admin-stat-value" id="statToday">0</div>
        <div class="admin-stat-label">Today's orders</div>
      </div>
    </div>
    <div class="admin-stat-card stat-revenue">
      <div class="admin-stat-icon"><i class="bi bi-currency-rupee"></i></div>
      <div>
        <div class="admin-stat-value" id="statRevenue">₹0</div>
        <div class="admin-stat-label">Confirmed revenue</div>
      </div>
    </div>
  </div>

  <!-- Filters + Search -->
  <div class="admin-toolbar">
    <div class="admin-filter-tabs" id="adminFilterTabs">
      <button class="admin-filter-tab active" data-filter="All">All</button>
      <button class="admin-filter-tab" data-filter="Pending Verification">Pending</button>
      <button class="admin-filter-tab" data-filter="Confirmed">Confirmed</button>
      <button class="admin-filter-tab" data-filter="Preparing">Preparing</button>
      <button class="admin-filter-tab" data-filter="Delivered">Delivered</button>
      <button class="admin-filter-tab" data-filter="Rejected">Rejected</button>
    </div>
    <div class="admin-search-box">
      <i class="bi bi-search"></i>
      <input type="text" id="adminSearchInput" placeholder="Search order ID, name, phone...">
    </div>
  </div>

  <p class="admin-empty-state" id="adminEmptyState" style="display:none;">No orders in this filter yet.</p>

  <div class="admin-orders-grid" id="adminOrdersGrid"></div>

</div>

<!-- ══ SCREENSHOT LIGHTBOX ══ -->
<div class="admin-lightbox" id="adminLightbox">
  <span class="admin-lightbox-close" id="adminLightboxClose"><i class="bi bi-x-lg"></i></span>
  <img id="adminLightboxImg" src="" alt="Payment screenshot">
</div>

<!-- ══ EDIT ORDER MODAL ══ -->
<div class="admin-edit-overlay" id="adminEditOverlay">
  <div class="admin-edit-modal">
    <div class="admin-edit-header">
      <h3>Edit Order <span id="editOrderIdLabel"></span></h3>
      <span class="admin-edit-close" id="adminEditClose"><i class="bi bi-x-lg"></i></span>
    </div>

    <form id="adminEditForm">
      <div class="admin-edit-grid">
        <label class="admin-field">
          <span>Item Name</span>
          <input type="text" id="editItemName" required>
        </label>
        <label class="admin-field">
          <span>Pcs / Size</span>
          <input type="text" id="editPcsLabel" required>
        </label>
        <label class="admin-field">
          <span>Amount (₹)</span>
          <input type="number" id="editAmount" required>
        </label>
        <label class="admin-field">
          <span>Status</span>
          <select id="editStatus">
            <option value="Pending Verification">Pending Verification</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Preparing">Preparing</option>
            <option value="Delivered">Delivered</option>
            <option value="Rejected">Rejected</option>
          </select>
        </label>
        <label class="admin-field">
          <span>Customer Name</span>
          <input type="text" id="editCustomerName" required>
        </label>
        <label class="admin-field">
          <span>Phone</span>
          <input type="tel" id="editCustomerPhone" required>
        </label>
        <label class="admin-field admin-field-full">
          <span>Address</span>
          <textarea id="editCustomerAddress" rows="2" required></textarea>
        </label>
        <label class="admin-field">
          <span>Pincode</span>
          <input type="text" id="editCustomerPincode" required>
        </label>
      </div>

      <div class="admin-edit-actions">
        <button type="button" class="admin-btn-secondary" id="adminEditCancel">Cancel</button>
        <button type="submit" class="admin-btn-primary" id="adminEditSaveBtn">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="admin-firebase-config.js"></script>
<script src="admin.js" defer></script>

</body>
</html>
